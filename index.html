<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Project Leonida - IRL Etkinlik Kartları</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--line:#262638;--tx:#e9e9f2;--mut:#9a9ab5;--pink:#ff3d9a;--cyan:#27e1ff;--yel:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 400px at 10% -5%,#3a0f3a55,transparent),radial-gradient(900px 400px at 100% 0,#0a3a4a55,transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{text-align:center;padding:40px 16px 16px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:clamp(28px,7vw,52px);letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,var(--pink),var(--yel),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);margin:10px 0 0}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px 4px}
nav button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{color:#0b0b12;background:var(--cyan);border-color:var(--cyan);font-weight:700}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px;max-width:1200px;margin:0 auto;padding:16px}
article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
article::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--yel)}
h2{margin:0;font-size:19px;line-height:1.25}
h2 span{margin-right:6px}
dl{margin:0;display:grid;gap:8px}
dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
dd{margin:2px 0 0;font-size:14px;color:#cfcfe2;overflow-wrap:anywhere}
dt.c{color:var(--yel)}dt.h{color:var(--cyan)}
footer{max-width:760px;margin:8px auto 32px;padding:0 16px;text-align:center;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
<h1>Project Leonida</h1>
<p>IRL Etkinlik Kartları · Eray’ın oyunlarının GTA 6 villa uyarlamaları · 15 konsept</p>
</header>
<nav id="f"></nav>
<main id="m"></main>
<footer>Güvenlik notu: Elektronik ekipman havuzdan uzak durur, kimse itilmez, kovalamaca ve yarışlar yürüyüş hızında oynanır, chat cezaları mod onayından geçer.</footer>
<script>
var O=[
["🏙️","Leonida Emlak Karteli","Salon","Dev bir branda harita yere serilir. Ekip kendi bedeniyle piyon olur, zar atıp Vice City mekanlarını (Ocean Drive, Marina, Havalimanı) satın alır. Kiralar villadaki gerçek atıştırmalık stokundan ödenir.","Hapis = Busted. Şans kartları, chat’in yazıp modların onayladığı cezalardır.","Hapse düşen sandalyeye gevşekçe bağlanır, kefalet ister. Oyun sonunda en zengin “Kartel Babası” bir gün yemek siparişini seçer.","Mahkûm telsizle diğer oyunculara rüşvet teklif eder, kira indirimi koparmaya çalışır."],
["📦","Kapalı Kutu Müzayedesi: Vice City","Salon","Eray’ın getirdiği kutu ve çöp poşetleri açık artırmaya çıkar. Ekip kendi cebindeki gerçek parayla teklif verir; sadece tartma, sallama ve 30 saniyelik koklamaya izin var.","Lester’ın çalıntı depo baskını. Eray “taşınmaz kaçakçı” gibi dellallık yapar.","İçinden lüks yemek hakkı da çıkar, 5 liralık çöp de, ertesi öğün bulaşık da. Çöp alana “İflas” tişörtü giydirilir.","Cezalı kişi çekici eline alıp dellal olur, artırmayı o yönetir."],
["🍗","Cluckin’ Bell Mutfak Savaşı","Mutfak","İki takım, chat’in seçtiği gizli malzeme sepeti, 15 dakika. Her takımda bir “Kör Aşçı” gözleri bağlı pişirir, partneri sadece telsizle yönlendirir.","Fast-food sahnesi, Wanted yıldızıyla puanlanır: en kötü tabak 3 yıldız alır.","Kazanan menüyü seçer. En kötü tabağı yapan kendi yemeğinin acı soslu “tadımlığını” yer ve bulaşığı yıkar.","Bulaşıkçı “Mutfak Muhabiri” olur, yayının kamerasını taşır."],
["🛡️","Zırh Parçalama: Havuz Düellosu","Havuz","Herkes göğsüne 5 su balonundan “zırh yeleği” bağlar. Su tabancalarıyla havuz kenarında elemeli turnuva yapılır, balon patlayan zırh kaybeder.","Body armor ve silah düellosu. Yıldızı yüksek olan kişi başlangıçta fazladan balon alır.","Finali kaybeden gönüllü havuza atlar (“Wasted”). Kazanan “Silah Taciri” olur, sonraki etkinlikte bir kişiye avantaj satar.","Islanan “Sahil Muhabiri” olarak havluyla yayında kalır, mikrofonu su geçirmez kılıfta."],
["🔍","Kim Soydu? (Heist Cluedo)","Villa","Eray gizlice bir “soygun” kurar: Bekir’in çayı kayıp. Herkes odaları gezip ipucu toplar ve Kim, Nerede, Hangi mutfak aletiyle sorusunu cevaplamaya çalışır.","Soygun sonrası soruşturma. Herkes dedektif, biri gerçek suçlu.","Doğru bilen ganimeti alır. Yanlış suçlayan 1 yıldız yer ve gün boyu “Yanlış İddia” bandanası takar. Suçlu yakalanmazsa ganimet onundur.","Suçlanan kişi “ifade verir”, doğruyu da yalanı da kamerayla anlatır."],
["🗺️","Turf Savaşı (Risk)","Bahçe","Bahçe 6 bölgeye bölünür (kasalar, şezlonglar, barbekü). İki çete zarla bölge fetheder, saldırılar mini düello ile çözülür: bilek güreşi, halat çekme, tek ayak.","Çete savaşları. Chat bir “polis baskını” tetikleyip iki bölgeyi dondurabilir.","Kaybeden çete bölgelerini yitirir ve ertesi sabah kazananlara kahve taşır. Son bölgeyi tutan çete kazanır.","Elenen “Hava Desteği” olur, chat oylamasıyla savaşa sürpriz etki yollar."],
["🧱","Kasa Jenga","Salon","Her Jenga bloğunun üstünde GTA görevi yazar: “NPC gibi yürü”, “Eray’ı taklit et”, “10 saniye bağır”. Kuleyi yıkan Wasted olur.","Alarmı tetikleyen hırsız; kule yıkılınca ekranda “WASTED”.","Yıkan 2 yıldız alır ve sonraki iki turu tek elle oynar. En çok görev bitiren ganimet kutusunu seçer.","Eli bağlı kişi oyunda kalır, ama sadece kendi bloğunu itebilir."],
["🎰","Diamond Casino: Yalancı Zarı","Salon","Herkes bardak altında zar tutar, miktar teklifi ve blöf yapılır. Fişler kuru yemiş ve çikolatadır, kimse gerçek para koymaz.","Casino heist gecesi. Neon ışık, krupiye şapkası.","Zarı bitenler elenir, en son kalan jackpotu alır: ertesi sabah ilk oyun seçimi. Blöf yakalayan fiş kazanır.","Elenen “Krupiye” olur, zarları o dağıtır, blöfleri o kontrol eder."],
["🕵️","Köstebek Operasyonu (Mafya)","Salon","Roller: Polis, Çete Üyesi, Muhbir, Köstebek. Kısa turlar halinde tartışma ve oylama; tur başına bir kişi “tutuklanır”.","Undercover polis ve sızma operasyonu.","Köstebek yakalanırsa yayında “itiraf” kameraya konuşur. Köstebek kazanırsa iki kişinin bakiyesinden pay alır.","Tutuklanan “Hayalet” olur, chat gibi telefondan yorum yapar ve ipucu fısıldar."],
["📻","Şifreli Telsiz (Tabu)","Salon","Anlatıcı GTA hile kodlarını, mekanları ve karakterleri yasak kelimeler yüzünden sadece ses değiştirici telsizle anlatmaya çalışır.","Heist komuta telsizi. Takım arkadaşı bilemezse alarm çalar.","60 saniyede bilemeyen takım “Wasted” olur ve ekşi limonata shot’ı içer. En çok kelime bilen takım sonraki turda joker alır.","Ceza yiyen yedek anlatıcı olur, bir sonraki turda hakem."],
["🏁","Ofis Sandalyesi Grand Prix","Villa","Villa koridoru pist olur. İki kişilik takımlar, biri oturur diğeri iter, bayrak sistemiyle yarışır. Hız yürüyüş hızıyla sınırlı, kask yerine bandana.","Sokak yarışı. Her turun sonunda “Kaçış Turu”, kazanan yıldız silme hakkı alır.","Kaybeden takım ters yönde son turu atar. Kazanan sonraki yemekte masanın başına oturur.","Ters tur atan taşıyıcı yayında “Pit Ekibi” rolüyle yarışı anlatır."],
["🖼️","Arananlar Listesi (Kör Pictionary)","Salon","Çizenin gözü bağlıdır, partneri tarif ederek çizdirir. Çizilen “suçlu” kişi yayındaki bir ekip üyesidir.","Posterler “Wanted” afişi olur, chat en komik posteri seçer.","En kötü poster villanın duvarına asılır, sahibi gün boyu “Aranıyor” bandanasıyla dolaşır. En iyi poster 1 yıldız siler.","Bandanalı kişi tüm oyunlara normal katılır, sadece aranan bir kaçaktır."],
["💰","Vice City Kim Bilir?","Salon","10 soruluk yarışma: GTA lore’u ve ekibin eski yayın anıları. Chat’in joker hakkı var.","Yanlış cevap “Wasted Çarkı”nı döndürür, çarkta chat’in yazdığı 12 hafif ceza vardır.","Çarkta “el kamerası”, “sonraki cevapta kulaklık yok”, “kıyafet değiş” gibi cezalar. Doğru bilen sonraki cevabı bir kişiye devreder.","Cezalı oyundan çıkmaz, sadece jokersiz ve kulaklıksız devam eder."],
["⏰","Şafak Baskını (Uyanış Yayını)","Villa","Sabah yayınında bir “Polis Şefi” seçilir ve uyuyanları plan yaparak uyandırır: alarm sesi, mutfak kapağı, güvenli yöntemler. Uyuyanlar gece “tuzak” kurabilir.","Baskın operasyonu. Uyuyan kişi “Busted” ilan edilir.","İlk uyanan kahve hakkı kazanır. Baskın yiyen “Uykulu NPC” olur ve kahvaltı yayınında sadece 3 cümle kurabilir.","Uykulu NPC kahvaltı yayınının barista’sı olur."],
["🚚","Zırhlı Kamyon Soygunu","Bahçe","İki kişilik takımlar el arabasına su dolu kovalar ve top “ganimetini” yükler, bahçedeki engel parkurundan taşır. Rakip takım su tabancasıyla “koruma” olur.","Zırhlı kamyon soygunu, ganimet taşıma ve çatışma.","En az ganimet taşıyan takım “Fakir Soyguncu” rozeti alır, kazananın ayakkabısını parlatır. Rekor kıran 2 yıldız siler.","Ganimeti dökenler “Tamirci” olur, parkuru yeniden düzenler."]
];
var N=[
["🕵️","FIB Köstebeği (Among Us / Feign)","Villa","Herkese gizli bir kâğıt dağıtılır: birkaç Ajan, bir Köstebek. Ajanlar villada görev yapar (mutfakta paket hazırla, bahçeden evrak topla, odada şifre çöz), Köstebek görevleri gizlice sabote eder. Zil çalınca masada tartışma ve oylama yapılır.","Among Us ve Feign’in FIB heist hali. Köstebek her sabotajda yıldız biriktirir, yakalanırsa Busted.","Köstebek yakalanırsa ganimet ajanların, yakalanmazsa Köstebek ganimeti alır ve iki kişinin bakiyesinden pay çeker. Yanlış oylanan masum 1 yıldız yer.","Atılan kişi “Hayalet Ajan” olur: konuşamaz ama tabela ve el hareketleriyle görev yapmaya ve ipucu vermeye devam eder."],
["🔦","5 Yıldız: SWAT Baskını (Saklambaç)","Villa","Villanın tüm ışıkları kapanır, herkesin elinde sadece el feneri. Bir ya da iki kişi SWAT olur, diğerleri saklanır. Fenerle yakalanan “Busted” olur. 10 dakika, sadece belirli odalar.","Saklambaçın 5 yıldızlı Wanted hali: her dakika yıldız yükselir ve SWAT’a yeni fener eklenir.","Son kalan kaçak ganimet kasasını alır. Hiç yakalamayan SWAT ertesi sabah herkese kahve getirir.","Yakalanan “Rehine” olur ve SWAT’ın telsiz kamerasını tutar, oyunun içinde kalıp yön gösterir (doğru ya da yanlış)."],
["🔋","Lethal Hurda (Lethal Company)","Bahçe","Gece bahçeye 12 “hurda” (fosforlu eşya, kutu) saklanır. Ekip tek kafa feneriyle kotayı (300 puan) doldurmaya çalışır. Bir kişi “Canavar” olur, korkutucu sesler çıkarır ve ışıkları kapatmaya çalışır.","Bina soygunu ve şirket kotası. Kota dolmazsa 3 yıldız Wanted cezası gelir.","Kota dolarsa ekip “Şirket Primi” alır: yemeği en çok hurdayı getiren seçer. Dolmazsa herkes 2 yıldız yer, en az toplayan bahçeyi toplar.","Canavara yakalanan “Radyo Operatörü” olur: içeriden telsizle yön verir, haritayı çizer."],
["⛓️","Zincirli Kaçış (Chained Together)","Bahçe","İkişerli takımlar bileklerinden gevşek bir bandanayla birbirine bağlanır. Bahçede engel parkuru kurulur: şezlong tepesi, kova köprüsü, havuz kenarı. Önce bitişe varan kazanır.","Kaçak çiftin hapishane kaçışı, polisler su tabancasıyla arar.","Kazanan takım ganimet olarak yemek hakkı alır. Düşen takım “Wasted” olup havuza atlar. Son gelen takım parkuru söker.","Bandana çözülürse takım tek elle devam eder, yarıştan kopmaz."],
["🧪","Sızıntı Villa (Deceit)","Villa","Çoğunluk Masum, 1-2 kişi Enfekte. Masumlar villadaki 3 anahtar nesneyi bulup garaja götürmeye çalışır. Enfekteler gizlice “tuzak” kurar: kapıyı bantlar, nesneyi yer değiştirir, ışığı kapatır.","FIB laboratuvarından sızan virüs; tuzağa düşen her Masum 1 yıldız alır.","Masumlar kazanırsa Enfekteler bulaşığı yıkar. Enfekteler kazanırsa en çok tuzak kuran ganimeti seçer.","Tuzağa düşen “Test Deneği” olur: gözü bandanalı, ekipten yönlendirmeyle oyunu sürdürür."],
["🥊","Gang Beasts Sumo","Havuz","Havuz kenarında kaymaz zeminde çizilen dairede iki kişi şişme noodle’larla sumo yapar. Daireden ya da havuza düşen kaybeder. Elemeli turnuva.","Gang Beasts tarzı sokak kavgası; kaybeden “Wasted”.","Kazanan “Gang Lideri” olur ve bir kişiyi sonraki oyundan atar. Kaybeden havuza atlar.","Havuza düşen komik bir şapkayla “Spiker” olur, finali yayında anlatır."]
];
var D=[N[0],N[1],O[0],O[1],N[2],O[2],N[3],O[3],N[4],O[5],O[7],O[4],N[5],O[13],O[14]];
var T=["Hepsi","Salon","Mutfak","Bahçe","Havuz","Villa"];
var F=document.getElementById("f"),M=document.getElementById("m"),cur="Hepsi";
function draw(){
M.innerHTML=D.map(function(d,i){
return (cur==="Hepsi"||d[2]===cur)?'<article><div class="top"><span>#'+String(i+1).padStart(2,"0")+'</span><span class="tag">'+d[2]+'</span></div><h2><span>'+d[0]+'</span>'+d[1]+'</h2><dl><div><dt>İşleyiş</dt><dd>'+d[3]+'</dd></div><div><dt>GTA Bağlantısı</dt><dd>'+d[4]+'</dd></div><div><dt class="c">Ceza / Ödül</dt><dd>'+d[5]+'</dd></div><div><dt class="h">Yayında Kal</dt><dd>'+d[6]+'</dd></div></dl></article>':"";
}).join("");
F.innerHTML=T.map(function(t){return '<button class="'+(t===cur?"on":"")+'" data-t="'+t+'">'+t+'</button>'}).join("");
}
F.addEventListener("click",function(e){var t=e.target.getAttribute("data-t");if(t){cur=t;draw()}});
draw();
</script>

</html>
